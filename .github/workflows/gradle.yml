name: Build ReTerraForged (Forge + Fabric)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Cache Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repo top-level (for debug)
        run: ls -la

      - name: Run Gradle build for subprojects
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          set -e
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew wrapper found - aborting" >&2
            exit 1
          fi

          # Try building forge and fabric explicitly (preferred)
          echo "Attempting to build :forge and :fabric (if present)..."
          ./gradlew --no-daemon :forge:build :fabric:build --no-parallel --stacktrace || true

          # Some repos expect assemble/build at root; try conservative fallback
          echo "Fallback: run assemble/build at root to ensure jars produced"
          ./gradlew --no-daemon assemble build --no-parallel --stacktrace || true

          # If the project needs a specific remap/reobf task for Forge, uncomment and adjust below:
          # echo "If you need remap/reobf for Forge artifacts, run remap tasks (uncomment if required)"
          # ./gradlew --no-daemon :forge:remapJar :forge:reobfJar --no-parallel --stacktrace

      - name: Locate built JAR(s)
        id: find-jars
        run: |
          set -e
          echo "Searching for candidate JARs..."
          # search typical output dirs used by this repo
          JARS=$(find . -type f \( -path "*/forge/build/libs/*.jar" -o -path "*/fabric/build/libs/*.jar" -o -path "*/build/libs/*.jar" \) -not -name "*-sources.jar" -not -name "*-javadoc.jar" -print)
          if [ -z "$JARS" ]; then
            echo "No jars found in expected locations. Listing directories for debugging:" >&2
            find . -maxdepth 3 -type d -print
            exit 1
          fi
          echo "Found jars:"
          echo "$JARS"
          FIRST=$(echo "$JARS" | head -n 1)
          echo "jar_path=$FIRST" >> $GITHUB_OUTPUT
          echo "$JARS" > jars_to_upload.txt
          cat jars_to_upload.txt

      - name: Upload built JAR(s) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: reterraforged-built-jars
          path: |
            ${{ steps.find-jars.outputs.jar_path }}
            jars_to_upload.txt
            $(if [ -f jars_to_upload.txt ]; then cat jars_to_upload.txt; fi)

      - name: Show primary artifact path
        run: echo "Primary JAR: ${{ steps.find-jars.outputs.jar_path }}"

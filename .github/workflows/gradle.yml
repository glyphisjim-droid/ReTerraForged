name: Java CI with Gradle (1.20.1)

on:
  push:
    branches: [ "1.20.1" ]
  pull_request:
    branches: [ "1.20.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ▶️ Run forge:runData if Forge exists
      - name: Run forge:runData (if available)
        run: |
          if ./gradlew tasks --all | grep -q "forge:runData"; then
            echo "forge:runData detected — running..."
            ./gradlew --no-daemon --no-parallel forge:runData
          else
            echo "forge:runData not found — skipping."
          fi

      - name: Build with Gradle Wrapper
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          ./gradlew --version
          ./gradlew --no-daemon --no-parallel build --stacktrace || ( echo "Build failed — printing possible outputs"; ls -R ; exit 1 )

      - name: Find built JARs
        id: find-jars
        run: |
          JARS=$(find . -type f \( -path "*/forge/build/libs/*.jar" -o -path "*/fabric/build/libs/*.jar" -o -path "*/build/libs/*.jar" \) -not -name "*-sources.jar" -not -name "*-javadoc.jar" -print || true)
          echo "found jars: $JARS"
          if [ -z "$JARS" ]; then
            echo "No jars found" && exit 0
          fi
          echo "$JARS" > jars.txt
          echo "primary=$(echo "$JARS" | head -n1)" >> $GITHUB_OUTPUT

      - name: Upload JARs as artifact
        if: steps.find-jars.outputs.primary != ''
        uses: actions/upload-artifact@v4
        with:
          name: built-jars
          path: |
            jars.txt
            ${{ steps.find-jars.outputs.primary }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
